schema: spec-driven
context: |
  Selected direction: reproduce a bounded experiment from Deep Learning for
  Portfolio Optimization (Zhang, Zohren, Roberts), then build a mobile experiment
  lab to replace Flow on the resume. A Python research prototype, Android/web
  Expo client and unit-tested runs API/worker source exist. The client has a
  measured report viewer and typed equity/allocations readers. PostgreSQL checks
  and bounded real browser/API connect/list/submit/status/cancel pass; S3/worker
  publication, Compose and physical-device verification remain open. API/worker
  image builds and independent non-root migration/API/database restart and offline
  child checks pass. The Linux CPU worker has a complete wheel/hash lock; Windows
  and GPU locks remain open.
  Current stack: React Native/Expo client, Java/Spring Boot API, PostgreSQL, Liquibase,
  LocalStack, Docker Compose, and later K3s. Python/PyTorch owns research and background jobs.
  This supersedes Kotlin/Quarkus after the 2026-09-21 document correction request.
  The user confirmed a physical Android phone; web is an additional Expo target.
  Initial topology is the physical phone over Tailscale connecting to the backend
  and training worker on the user's PC; no emulator or public cloud required.
  Tailscale is disconnected at the user's request. Phone setup and endpoint access
  are deferred, not prerequisites for local implementation. No Serve endpoint exists.
  One small CPU-capable training run at a time initially; GPU acceleration optional.
  Current PC: Ryzen 9 6900HS, approximately 16 GB RAM, RTX 3060 Laptop GPU 6 GB VRAM.
  User selected apple-design guidance for UI: read docs/UI-DESIGN.md and the
  preserved docs/reference/apple-design.md. Adapt to native Android/Expo and web;
  the Android/web client has 91 passing component/contract tests, clean
  TypeScript/lint and Android/web exports as of 2026-10-15. Rendered Results use
  fixtures; separate real browser mutations pass. Physical-device and completed
  result publication checks remain open. The earlier synthetic adapter/A0 runner
  and causal fold planner passed 111 research tests and a separate CLI smoke.
  Current fold-runner/group/accounting/CLI and causality regression source is an
  unverified draft under the user's code-only/no-process instruction. Do not run
  project commands, imports, tests, builds, apps, services or commits until authorized.
  The user subsequently authorized only the lightweight file-reading helper and
  editing; keep project execution stopped and do no GPU work while their separate
  GPU model is running. This does not authorize training or checks.
  Explicit sweep, synthetic learnability and local fixed-holdout normalization
  controls also have unrun source/regression cases. RunConfig records train-only/raw;
  the existing train-only default is preserved by design, the synthetic service
  explicitly keeps train-only, and direct raw folds reject before runtime access.
  No paired normalization study, preferred mode or current-source compatibility is proven.
  Local RunConfig also records minibatch/full-training objective-window controls,
  with dynamic scope declarations and optimizer-step counts. Service/fold scopes
  stay explicitly minibatch. Full-training uses one update/full graph per epoch;
  no memory saving, isolated batch-size study or preferred method is established.
  Selected alternate local controls have strict setting-type preflight, while
  legacy default A0 validation scope remains unchanged. All new checks are unrun.
  A0 has prior-source Git provenance and local repeat/resume
  evidence; historical seed/cost research and v2 replay remain open.
  DESIGN.md is current; docs/archive/ABACUS-DESIGN.superseded.md is historical only.
  Preserve causal evaluation, data provenance, and explicit reproduction deviations.
  Document every logical change immediately in its implementation.md; keep HANDOFF.md
  and accepted design decisions consistent with actual work and verification.
rules:
  proposal:
    - Distinguish requirements, assumptions, and proposed additions.
  tasks:
    - Include immediate documentation updates and appropriate verification.

