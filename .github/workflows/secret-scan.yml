name: Secret checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked files
        run: python3 scripts/check_secrets.py --all
      - name: Scan reachable history
        run: python3 scripts/check_secrets.py --history
