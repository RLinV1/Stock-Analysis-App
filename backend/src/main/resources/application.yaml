spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio_lab}
    username: ${DATABASE_USER:portfolio_lab}
    password: ${DATABASE_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
