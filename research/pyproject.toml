[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-lab"
version = "0.1.0"
description = "Auditable, paper-inspired deep portfolio allocation experiments"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.6", "torch==2.8.0", "psutil==7.0.0", "filelock==3.32.6"]

[project.optional-dependencies]
data = ["yfinance==1.7.0"]

[project.scripts]
portfolio-lab = "portfolio_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
